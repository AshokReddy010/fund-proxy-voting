version: 2

sources:
  - name: raw
    description: Tables loaded by load_raw.py from SEC Form N-PX filings. Every column is text.
    schema: main
    tables:
      - name: raw_filings
        description: One row per N-PX filing (original or amendment).
      - name: raw_series
        description: One row per fund (series) named on a filing's cover page.
      - name: raw_votes
        description: One row per vote record, as written by the filer.
